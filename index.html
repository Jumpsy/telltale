<title>Telltale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: a bench. Code goes in on the left, the reading comes out on the right as a human-to-AI scale with its evidence beneath. */
:root {
  --paper: #eef0f4;       /* cool grey with a blue lean */
  --panel: #f9fafc;
  --ink: #141a2e;
  --ink-2: #4b5470;
  --rule: #d3d8e3;
  --signal: #2f43d9;      /* instrument ultramarine: the needle and focus */
  --human: #1f7a5a;
  --ai: #b3402a;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1320; --panel: #171c2d; --ink: #e8ebf5; --ink-2: #99a2bd; --rule: #2a3149;
    --signal: #8c9bff; --human: #4fc79a; --ai: #ff8a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1320; --panel: #171c2d; --ink: #e8ebf5; --ink-2: #99a2bd; --rule: #2a3149;
  --signal: #8c9bff; --human: #4fc79a; --ai: #ff8a70; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
h1 { font: 700 34px/1 var(--display); letter-spacing: -0.02em; margin: 0; }
header p { margin: 0; color: var(--ink-2); max-width: 52ch; }
.bench { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
.in-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.in-bar span { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: auto; }
select, button { font: 500 13px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
button:hover, select:hover { border-color: var(--signal); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
textarea { display: block; width: 100%; min-height: 420px; resize: vertical; border: 0; background: transparent; color: var(--ink); font: 400 13px/1.6 var(--mono); padding: 14px; tab-size: 4; white-space: pre; overflow: auto; }
textarea:focus-visible { outline-offset: -3px; }
.out { padding: 20px; display: grid; gap: 20px; }
.read { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.pct { font: 700 76px/0.9 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.verdict { font: 500 20px var(--display); }
.sub { color: var(--ink-2); font-size: 13px; margin: 2px 0 0; }
.scale { position: relative; padding-top: 22px; }
.track { height: 12px; border-radius: 2px; background: linear-gradient(90deg, var(--human), var(--rule) 50%, var(--ai)); opacity: .9; }
.ticks { position: absolute; left: 0; right: 0; top: 22px; height: 12px; background: repeating-linear-gradient(90deg, var(--panel) 0 1px, transparent 1px 10%); }
.needle { position: absolute; top: 12px; width: 0; height: 36px; border-left: 3px solid var(--ink); transition: left .35s ease; }
.needle::before { content: ""; position: absolute; top: -6px; left: -7px; border: 5px solid transparent; border-top: 7px solid var(--ink); }
.ends { display: flex; justify-content: space-between; margin-top: 8px; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
h2 { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.ev li { display: grid; grid-template-columns: 1fr 120px; gap: 12px; align-items: center; font-size: 14px; }
.bar { height: 8px; background: var(--rule); border-radius: 1px; position: relative; }
.bar i { position: absolute; top: 0; bottom: 0; background: var(--ai); }
.bar i.h { background: var(--human); }
.bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--ink-2); }
.note { border-top: 1px solid var(--rule); padding-top: 14px; color: var(--ink-2); font-size: 13px; margin: 0; }
.warn { background: color-mix(in srgb, var(--ai) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--ai) 35%, var(--rule)); padding: 8px 10px; border-radius: 4px; font-size: 13px; }
footer { color: var(--ink-2); font-size: 13px; max-width: 78ch; }
footer b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .needle { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Telltale</h1>
    <p>Paste code in any language. Telltale reads how it was written and says whether it looks closer to human work from before 2020 or to output from today's AI models.</p>
  </header>

  <div class="bench">
    <section class="card" aria-label="Code input">
      <div class="in-bar">
        <span>Code in</span>
        <label for="lang" class="sr" style="position:absolute;left:-9999px">Language</label>
        <select id="lang">
          <option value="">Auto-detect language</option>
          <option>py</option><option>js</option><option>ts</option><option>java</option><option>go</option><option>rs</option>
          <option>c</option><option>cpp</option><option>cs</option><option>rb</option><option>php</option><option>kt</option><option>swift</option>
        </select>
        <button id="s-human" type="button">Example: Go, 2019</button>
        <button id="s-ai" type="button">Example: AI answer</button>
      </div>
      <textarea id="code" spellcheck="false" aria-label="Paste code here"></textarea>
    </section>

    <section class="card out" aria-label="Reading" aria-live="polite">
      <div>
        <div class="read"><div class="pct" id="pct">0%</div><div><div class="verdict" id="verdict"></div><p class="sub" id="sub"></p></div></div>
      </div>
      <div>
        <div class="scale"><div class="track"></div><div class="ticks"></div><div class="needle" id="needle"></div></div>
        <div class="ends"><span>Human</span><span>AI</span></div>
      </div>
      <div id="warn" class="warn" hidden></div>
      <div><h2>What moved the needle</h2><ul class="ev" id="ev"></ul></div>
      <p class="note" id="note"></p>
    </section>
  </div>

  <footer id="foot"></footer>
</div>

<script>/* aicodedetect core: language-agnostic stylometry. Runs in node (training) and the browser (the page).
   One source of truth: the trained model is fitted on the exact features this file computes. */
(function (root) {
  const LINE = {
    py: ['#'], rb: ['#'], sh: ['#'], yml: ['#'], yaml: ['#'], toml: ['#'], r: ['#'], pl: ['#'],
    js: ['//'], jsx: ['//'], ts: ['//'], tsx: ['//'], java: ['//'], c: ['//'], cpp: ['//'], cc: ['//'], h: ['//'], hpp: ['//'],
    cs: ['//'], go: ['//'], rs: ['//'], swift: ['//'], kt: ['//'], scala: ['//'], dart: ['//'], php: ['//', '#'],
    sql: ['--'], lua: ['--'], hs: ['--'], vb: ["'"],
  };
  const EXT_ALIAS = { javascript: 'js', typescript: 'ts', python: 'py', csharp: 'cs', ruby: 'rb', rust: 'rs', kotlin: 'kt', golang: 'go', 'c++': 'cpp', mjs: 'js', cjs: 'js' };
  const NOSEMI = new Set(['py', 'rb', 'go', 'kt', 'swift', 'lua', 'sh', 'hs', 'yml', 'yaml', 'toml', 'sql', 'rs']);

  const RESTATING = /^(initiali[sz]e|init|create|define|set up|setup|loop (through|over)|iterate|return|check (if|whether|for)|get|calculate|compute|convert|handle|validate|ensure|import|helper|main|example|test|print|append|add|update|parse|process|store|save|load|open|close|apply|extract|filter|sort|step \d+|first|next|finally|then|if|else|for|while|increment|decrement|declare|call|use|find|remove|check|build|read|write|split|join|iterate)\b/i;
  const AI_PHRASES = /\b(here'?s|here is|note that|let'?s|certainly|sure,|of course|as an ai|robust|comprehensive|seamless(ly)?|leverage[sd]?|utili[sz]e[sd]?|gracefully|ensures? that|best practices?|edge cases?|under the hood|for simplicity|real[- ]world|production[- ]ready|self[- ]contained|this (function|method|class|script|module|program|code) (will|is|provides|takes|returns|implements|demonstrates)|example usage|time complexity|space complexity|o\(\w+\))/gi;
  const HUMAN_MARKERS = /\b(todo|fixme|hack|xxx|wtf|idk|ugh|kludge|workaround|lol|why does|this sucks|no idea|doesn'?t work|works on my|bug|broken|temporary|for now)\b/gi;
  const EMOJI = /[\u{1F300}-\u{1FAFF}\u2600-\u27BF\u2705\u274C\u2713\u2717\u26A0]/u;
  const FUNC_DEF = /(^|\s)(def|fn|func|function|fun|sub)\s+[A-Za-z_]\w*|\b(public|private|protected|static|internal)\b[^\n;{=]*\w+\s*\([^)]*\)\s*(\{|:|throws)|^\s*[A-Za-z_][\w:<>,\*&\s\[\]]*\s+\**[A-Za-z_]\w*\s*\([^;)]*\)\s*\{?\s*$/gm;
  const KEYWORDS = new Set(('if else elif for while return def class import from as in is not and or try except finally with lambda pass break continue none true false self this null nil undefined ' +
    'function const let var new async await yield raise print public private protected static void int str bool float string len range fn func fun use mod pub impl struct enum interface package ' +
    'namespace using extends implements override final abstract switch case default do throw throws catch char long double byte short unsigned signed auto template typename include define ' +
    'end then begin elsif unless puts require module self end def').split(' '));
  const GENERIC = new Set(['data', 'result', 'results', 'value', 'values', 'item', 'items', 'temp', 'output', 'response', 'input', 'obj', 'list', 'array', 'map']);

  const safe = (a, b) => (b ? a / b : 0);
  const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
  const sd = (a) => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(mean(a.map((x) => (x - m) ** 2))); };
  const clamp01 = (x) => Math.max(0, Math.min(1, x));

  function normLang(l) { l = (l || '').toLowerCase().replace(/^\./, ''); return EXT_ALIAS[l] || l; }

  function detectLang(src) {
    const t = src;
    if (/^\s*(def |class \w+(\(.*\))?:|import \w+$|from \w+ import|if __name__)/m.test(t) && !/[;{}]\s*$/m.test(t)) return 'py';
    if (/\bfn \w+\(.*\)|let mut |impl\b|println!/.test(t)) return 'rs';
    if (/^package \w+|\bfunc \w+\(|:= /m.test(t) && /\bfunc\b/.test(t)) return 'go';
    if (/<\?php|\$\w+\s*=/.test(t)) return 'php';
    if (/\bfun \w+\(|\bval \w+/.test(t)) return 'kt';
    if (/\bnamespace \w+|\busing System|Console\.Write|\bstring\[\]/.test(t)) return 'cs';
    if (/\bpublic (static )?(class|void|int)|System\.out|import java\./.test(t)) return 'java';
    if (/#include\s*[<"]|\bstd::|cout\s*<</.test(t)) return /std::|cout|class |template/.test(t) ? 'cpp' : 'c';
    if (/\blet \w+: |\binterface \w+|: (string|number|boolean)\b/.test(t)) return 'ts';
    if (/\bfunc \w+\(.*\) ->|\bvar \w+: |\bimport (Foundation|UIKit|SwiftUI)/.test(t)) return 'swift';
    if (/\bdef \w+|\bend$|puts |attr_accessor/m.test(t)) return 'rb';
    if (/\b(const|let|var) |=> |function\s*\(|console\./.test(t)) return 'js';
    return 'txt';
  }

  function stripBlockComments(src, lang) {
    // returns {code, blocks[]} where blocks are doc/block comment bodies
    const blocks = [];
    let code = src;
    if (lang === 'py') {
      code = code.replace(/("""|''')([\s\S]*?)\1/g, (m, q, body) => { blocks.push(body); return '"S"'; });
    } else if (lang === 'rb') {
      code = code.replace(/^=begin[\s\S]*?^=end/gm, (m) => { blocks.push(m); return ''; });
    } else if (!['sh', 'yml', 'yaml', 'toml', 'sql', 'lua', 'hs'].includes(lang)) {
      code = code.replace(/\/\*([\s\S]*?)\*\//g, (m, body) => { blocks.push(body); return ''; });
    }
    return { code, blocks };
  }

  function features(srcIn, langIn) {
    const src = srcIn.replace(/\r\n/g, '\n');
    const lang = normLang(langIn) && LINE[normLang(langIn)] ? normLang(langIn) : (normLang(langIn) && normLang(langIn) !== 'txt' ? normLang(langIn) : detectLang(src));
    const markers = LINE[lang] || ['//', '#'];
    const { code: noBlocks, blocks } = stripBlockComments(src, lang);
    const lines = src.split('\n');
    if (lines.length && lines[lines.length - 1] === '') lines.pop();

    const comments = [];
    const codeLines = [];
    let inline = 0;
    for (const raw of noBlocks.split('\n')) {
      const s = raw.trim();
      if (!s) continue;
      const m = markers.find((k) => s.startsWith(k));
      if (m && !(m === '#' && /^#(include|define|if|ifdef|ifndef|endif|pragma|import)\b/.test(s)) && !(m === '#' && lang === 'php' && s.startsWith('#['))) {
        comments.push(s.replace(/^(\/\/\/?|\/\/!|#!?|--)\s*/, ''));
      } else {
        codeLines.push(raw);
        if (markers.some((k) => new RegExp('\\s' + k.replace(/[/#]/g, '\\$&') + '\\s\\S').test(raw)) && !/["'`]/.test(raw)) inline++;
      }
    }
    for (const b of blocks) comments.push(...b.split('\n').map((x) => x.replace(/^\s*\*?\s?/, '').trim()).filter(Boolean));
    const nCode = Math.max(codeLines.length, 1);
    const f = {};
    f.log_lines = Math.log(1 + lines.length);
    f.comment_ratio = Math.min(safe(comments.length, nCode), 2);
    f.inline_comment_ratio = safe(inline, nCode);
    f.restating_ratio = safe(comments.filter((c) => RESTATING.test(c)).length, Math.max(comments.length, 1));
    f.comment_capitalized = safe(comments.filter((c) => /^[A-Z]/.test(c)).length, Math.max(comments.length, 1));
    f.comment_period = safe(comments.filter((c) => /\.$/.test(c)).length, Math.max(comments.length, 1));
    f.dividers = comments.some((c) => /^[=\-_*#~]{4,}/.test(c)) ? 1 : 0;
    f.step_comments = comments.filter((c) => /^step\s*\d+/i.test(c)).length >= 2 ? 1 : 0;
    f.no_comments = comments.length === 0 ? 1 : 0;
    f.ai_phrases = Math.min((src.match(AI_PHRASES) || []).length, 6) / 6;
    f.human_markers = Math.min((src.match(HUMAN_MARKERS) || []).length, 3) / 3;
    f.emoji = EMOJI.test(src) ? 1 : 0;
    f.em_dash = src.includes('\u2014') ? 1 : 0;
    f.non_ascii = /[^\x00-\x7f]/.test(src) ? 1 : 0;
    const commentedCode = lines.filter((l) => /^\s*(#|\/\/)\s*(print|console\.log|import |def |if |for |return |self\.|this\.|\w+\s*=\s*\S|\w+\(.*\);?$|\})/.test(l)).length;
    f.commented_code = Math.min(commentedCode, 3) / 3;
    f.debug_prints = Math.min((src.match(/\b(print\(|println!?\(|console\.(log|error)\(|System\.out\.print|fmt\.Print|printf\(|cout\s*<<|puts |echo |Console\.Write)/g) || []).length, 6) / 6;

    // Doc coverage: doc blocks vs function definitions.
    const funcs = (src.match(FUNC_DEF) || []).length;
    const docs = blocks.length + lines.filter((l) => /^\s*(\/\/\/|##|--\s*\|)/.test(l)).length;
    f.doc_coverage = funcs ? Math.min(docs / funcs, 1) : (docs ? 1 : 0);
    f.doc_tags = (src.match(/(@param|@returns?|@throws|:param|:return|Args:|Returns:|Raises:|Parameters:|\\param|\\return|# Arguments|# Returns)/g) || []).length >= 2 ? 1 : 0;
    f.func_count = Math.log(1 + funcs);
    const tryN = (src.match(/\b(try|begin|rescue|catch)\b/g) || []).length;
    f.try_per_func = Math.min(safe(tryN, Math.max(funcs, 1)), 2);
    f.broad_catch = /(except\s+(Exception|BaseException)|except\s*:|catch\s*\(\s*(final\s+)?(Exception|Throwable|\w*\s*\.\.\.)|catch\s*\(\s*\w+\s*\)|rescue\s*(=>|StandardError|$)|catch\s*\(e\))/.test(src) ? 1 : 0;
    f.main_guard = /(__name__\s*==|\bfunc main\(|\bfn main\(|static void main|int main\(|static void Main|\bmain\(\)\s*\{|require\.main\s*===|\bmodule\.exports\b)/.test(src) ? 1 : 0;
    f.error_strings = Math.min((src.match(/["'`](Error|Invalid|Failed|Cannot|Unable|Expected|Missing|Unexpected)[^"'`]{4,}/g) || []).length, 4) / 4;
    f.type_annotations = lang === 'py' ? (/def \w+\([^)]*:\s*\w/.test(src) || /\)\s*->\s*\w/.test(src) ? 1 : 0) : (['ts', 'tsx', 'kt', 'swift', 'rs', 'go', 'java', 'cs'].includes(lang) ? 1 : 0);
    f.py_hints = lang === 'py' ? (/def \w+\([^)]*:\s*\w[^)]*\)\s*->/.test(src) ? 1 : 0) : 0;
    f.try_exc_msg = /(\$\{error|f"[^"]*\{e\}|"\s*\+\s*e\b|err\.Error\(\)|\{error\}|\{e\})/.test(src) ? 1 : 0;

    // Layout.
    const nb = lines.filter((l) => l.trim());
    const lens = nb.map((l) => l.replace(/\s+$/, '').length);
    f.line_len_cv = nb.length > 3 ? safe(sd(lens), mean(lens)) : 0.7;
    f.line_len_mean = Math.min(mean(lens), 120) / 120;
    f.max_line_over100 = lens.some((x) => x > 100) ? 1 : 0;
    f.trailing_ws = Math.min(safe(lines.filter((l) => l !== l.replace(/\s+$/, '')).length, Math.max(lines.length, 1)) * 10, 1);
    f.tab_indent = lines.some((l) => l.startsWith('\t')) ? 1 : 0;
    f.tab_space_mix = f.tab_indent && lines.some((l) => /^ {2,}\S/.test(l)) ? 1 : 0;
    f.blank_ratio = safe(lines.length - nb.length, Math.max(lines.length, 1));
    f.double_quotes = (() => { const d = (src.match(/"/g) || []).length, s = (src.match(/'/g) || []).length; return d + s ? d / (d + s) : 0.5; })();
    f.allman_brace = /^\s*\{\s*$/m.test(src) ? 1 : 0;
    const indents = nb.map((l) => (l.match(/^[ ]*/) || [''])[0].length).filter((x) => x > 0);
    f.indent4 = indents.length ? safe(indents.filter((x) => x % 4 === 0).length, indents.length) : 0.5;
    f.indent2 = indents.length ? safe(indents.filter((x) => x % 2 === 0).length, indents.length) : 0.5;

    // Spacing discipline.
    let body = codeLines.map((l) => l.replace(/"(\\.|[^"\\])*"|'(\\.|[^'\\])*'|`[^`]*`/g, 'S')).join('\n');
    body = body.replace(/\(([^()]*)\)/g, (m) => m.replace(/(\w)=(?!=)(\S)/g, '$1 KW $2'));
    body = body.replace(/->|=>|\+\+|--|<<|>>|::|\*\*|\/\*|\*\/|<\w[\w<>, ]*>|#include\s*<[^>]*>/g, ' ').replace(/\*,|\/,/g, ' ,');
    const ops = (body.match(/\w\s?(==|!=|<=|>=|[=+*\/<>])\s?\w/g) || []).length || 1;
    const tight = (body.match(/\w(==|!=|<=|>=|[=+*\/<>])\w|\w(==|!=|<=|>=|[=+*\/<>]) \w|\w (==|!=|<=|>=|[=+*\/<>])\w/g) || []).length;
    f.sloppy_spacing = /\w[=+*\/<>]\w|,\S/.test(body) ? Math.min(safe(tight, ops) * 2, 1) : 0;
    f.comma_nospace = /,[^\s)\]}\n]/.test(body) ? 1 : 0;
    f.spaced_ops = /\w \S{1,2} \w/.test(body) && !f.sloppy_spacing && !f.comma_nospace ? 1 : 0;
    f.semicolon_stack = !NOSEMI.has(lang) && /;\s*\w[^;\n]*;/.test(body) && !/for\s*\(/.test(body) ? 1 : 0;
    f.oneliner_block = /^[ \t]*(if|for|while|elif|else)\b[^\n{]*[:)][ \t]*[^\s#{][^\n]*$/m.test(body) ? 1 : 0;
    f.semis_present = NOSEMI.has(lang) ? 0 : safe(codeLines.filter((l) => /;\s*$/.test(l)).length, nCode);

    // Identifiers.
    const idents = (codeLines.join('\n').replace(/"(\\.|[^"\\])*"|'(\\.|[^'\\])*'/g, ' ').match(/\b[A-Za-z_][A-Za-z0-9_]*\b/g) || []).filter((i) => !KEYWORDS.has(i.toLowerCase()));
    const names = new Set(idents);
    f.ident_len_mean = Math.min(mean(idents.map((i) => i.length)), 20) / 20;
    f.single_letter = Math.min(safe(idents.filter((i) => i.length === 1).length, Math.max(idents.length, 1)) * 5, 1);
    const snake = [...names].filter((n) => /^[a-z][a-z0-9]*(_[a-z0-9]+)+$/.test(n)).length;
    const camel = [...names].filter((n) => /^[a-z]+([A-Z][a-z0-9]*)+$/.test(n)).length;
    f.naming_mixed = snake >= 2 && camel >= 2 ? 1 : 0;
    f.descriptive_names = Math.min(safe([...names].filter((n) => n.length >= 8 && (/_/.test(n) || /[a-z][A-Z]/.test(n))).length, Math.max(names.size, 1)) * 3, 1);
    f.long_names = Math.min(safe([...names].filter((n) => n.length >= 14).length, Math.max(names.size, 1)) * 4, 1);
    f.generic_names = Math.min(safe(idents.filter((i) => GENERIC.has(i.toLowerCase())).length, Math.max(idents.length, 1)) * 10, 1);
    f.terse_names = Math.min(safe([...names].filter((n) => n.length <= 3).length, Math.max(names.size, 1)) * 2, 1);
    return { lang, f, codeLines: codeLines.length };
  }

  function predict(model, srcIn, langIn) {
